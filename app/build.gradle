plugins {
    id 'com.android.application'
}

android {
    namespace 'id.riki.osvyn.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'id.riki.osvyn.mobile'
        minSdk 28
        targetSdk 34
        versionCode 11
        versionName '1.4.3'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
